[project]
name = "qcp_objects"
dynamic=['version'] # Handled through setuptools-scm
description = ''
readme = "README.md"
requires-python = ">=3.8"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]

[tool.setuptools_scm]
version_file = "src/qcp_objects/_version.py" # Make a version file (can the be used by this very package)

[build-system]
requires = ["setuptools>=80", "wheel", "setuptools_scm>=8"]
build-backend = "setuptools.build_meta"